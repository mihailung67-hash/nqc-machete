<style>

  .bara { background: #004E7D; color: #fff; min-height: 56px; display: flex; align-items: center; padding: 0 24px; font-weight: 900; line-height: 0.95; font-size: 15px; letter-spacing: 0.04em; }

  button:hover { background: #004E7D; }
  button:disabled { opacity: 0.6; cursor: wait; }

  </form>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decripteaza(parola) {
  const baza = await crypto.subtle.importKey('raw', new TextEncoder().encode(parola), 'PBKDF2', false, ['deriveKey']);
  const cheie = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: 600000, hash: 'SHA-256' }, baza, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const bytes = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, cheie, b64(P.d));
  return new TextDecoder().decode(bytes);
}
if (typeof document !== 'undefined') {
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const b = document.getElementById('b'), m = document.getElementById('m');
    b.disabled = true; m.style.color = '#6C7380'; m.textContent = 'Se deschide…';
    try {
      const html = await decripteaza(document.getElementById('p').value.trim());
      document.open(); document.write(html); document.close();
    } catch (err) {
      m.style.color = '#C8373A'; m.textContent = 'Parola nu e bună. Verific-o și încearcă din nou.';
      b.disabled = false;
    }
  });
}

// Deschiderea din aplicația NQC ERP: parola vine în fragmentul linkului (#p=…), care nu pleacă spre server.
if (typeof document !== 'undefined' && location.hash.indexOf('#p=') === 0) {
  let parolaDinLink = '';
  try { parolaDinLink = decodeURIComponent(location.hash.slice(3)).trim(); } catch (e) {}
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  if (parolaDinLink) {
    const b = document.getElementById('b'), m = document.getElementById('m');
    b.disabled = true; m.style.color = '#6C7380'; m.textContent = 'Se deschide…';
    decripteaza(parolaDinLink)
      .then((html) => { document.open(); document.write(html); document.close(); })
      .catch(() => { m.style.color = '#C8373A'; m.textContent = 'Deschiderea directă nu a mers. Scrie parola.'; b.disabled = false; });
  }
}
